# Opens small PRs when a dependency is out of date. Weekly, so it stays calm.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
