# Builds tonight's data from NYISO and publishes the app to GitHub Pages.
# Runs every hour, on every release to main, and on demand.
# If the pipeline fails (NYISO late, or the file breaks the contract), nothing is deployed:
# the last good site stays up and the app shows "Data delayed".
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 * * * *' # 10 past every hour, after NYISO posts new readings
  workflow_dispatch:

# Least privilege: the build job (which installs packages) can only read.
# Only the deploy job gets the rights to publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # Past NYISO files never change, so keep them between runs (fewer downloads).
      - uses: actions/cache@v6
        with:
          path: backend/.cache
          key: nyiso-${{ github.run_id }}
          restore-keys: nyiso-

      - name: Build tonight.json from NYISO
        working-directory: backend
        run: python -m cleanr --out ../frontend/public/tonight.json --cache .cache

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
